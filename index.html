<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 자동화 · Jev 인스타 트렌드 대시보드</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#262a33; --text:#e6e8ee; --muted:#8b91a1; --accent:#7c9cff; --green:#3ec38b; --amber:#f5b041; --red:#f06a6a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 28px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; gap:16px; flex-wrap:wrap; }
  header h1 { margin:0; font-size:20px; }
  header .meta { color:var(--muted); font-size:13px; }
  main { display:grid; grid-template-columns: 1fr 320px; gap:20px; padding:20px 28px; }
  @media (max-width: 1000px) { main { grid-template-columns:1fr; padding:14px; } header { padding:14px; } }
  section.panel { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:16px; }
  h2 { font-size:14px; margin:0 0 12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { padding:4px 10px; border-radius:999px; background:#222634; font-size:12px; color:var(--text); border:1px solid transparent; cursor:pointer; }
  .chip small { color:var(--muted); margin-left:4px; }
  .filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  select, input[type=search], button { background:#222634; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:7px 10px; font-size:13px; }
  input[type=search] { flex:1; min-width:180px; }
  button.primary { background:var(--accent); color:#0b0d12; border:none; font-weight:600; cursor:pointer; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:12px; }
  .card { background:#1c2029; border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:8px; }
  .card.dim { opacity:.5; filter:saturate(.4); }
  .card.dim:hover { opacity:.9; filter:none; }
  .card .top { display:flex; justify-content:space-between; font-size:12px; color:var(--muted); align-items:center; gap:8px; }
  .card .acct { color:var(--accent); font-weight:600; }
  .card .idea { font-size:14px; line-height:1.45; font-weight:600; }
  .card .summary { font-size:12px; color:var(--muted); line-height:1.45; }
  .card .caption { font-size:12px; color:var(--muted); max-height:0; overflow:hidden; transition:max-height .2s; white-space:pre-wrap; }
  .card.open .caption { max-height:400px; overflow:auto; }
  .card .tags { display:flex; gap:4px; flex-wrap:wrap; }
  .tag { font-size:11px; padding:2px 7px; border-radius:6px; background:#262b38; color:#c9cfdd; }
  .tag.tool { background:#2a3352; color:#a9bbff; }
  .tag.type { background:#2b3a31; color:#8fe0b6; }
  .tag.topic { background:#3a2e4a; color:#d9b8ff; font-weight:600; }
  .card .stats { font-size:12px; color:var(--muted); display:flex; gap:10px; align-items:center; }
  .scorebox { display:flex; align-items:center; gap:8px; }
  .bigscore { font-size:22px; font-weight:800; }
  .bigscore.실용 { color:var(--green); } .bigscore.흥미 { color:var(--amber); } .bigscore.비현실 { color:var(--red); }
  .verdict { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:700; }
  .verdict.실용 { background:#1f3a2e; color:var(--green); } .verdict.흥미 { background:#3a3320; color:var(--amber); } .verdict.비현실 { background:#3a2323; color:var(--red); }
  .subscores { display:flex; gap:6px; flex-wrap:wrap; font-size:11px; color:var(--muted); }
  .subscores span b { color:var(--text); }
  .why { font-size:12px; line-height:1.5; color:#c9cfdd; background:#141720; border-left:3px solid var(--accent); padding:8px 10px; border-radius:6px; }
  .gate { font-size:11px; color:var(--green); }
  details.guide summary { font-size:12px; color:var(--accent); cursor:pointer; font-weight:600; }
  .guide ol { font-size:12px; color:#dfe3ec; padding-left:18px; margin:6px 0 0; line-height:1.55; }
  .card .actions { display:flex; gap:6px; align-items:center; margin-top:4px; }
  .card textarea { width:100%; background:#141720; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font-size:12px; min-height:52px; resize:vertical; }
  .status { font-size:11px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .status.보류 { background:#2a2e3a; color:var(--muted); } .status.시도중 { background:#3a3320; color:var(--amber); } .status.적용완료 { background:#1f3a2e; color:var(--green); }
  ul.queue { padding:0; margin:0; }
  .queue li { list-style:none; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .queue li:last-child { border-bottom:none; }
  .queue a { color:var(--accent); text-decoration:none; }
  .bars { display:flex; flex-direction:column; gap:6px; }
  .bar { display:grid; grid-template-columns: 80px 1fr 30px; align-items:center; gap:8px; font-size:12px; }
  .bar .track { height:8px; background:#222634; border-radius:4px; overflow:hidden; }
  .bar .fill { height:100%; background:var(--accent); }
  .empty { text-align:center; padding:60px 20px; color:var(--muted); line-height:1.7; }
  .empty code { background:#222634; padding:2px 6px; border-radius:4px; }
  .top3 li { list-style:none; padding:10px 0; border-bottom:1px solid var(--line); font-size:13px; }
  .top3 li:last-child { border-bottom:none; }
  .top3 .t { font-weight:600; }
  .top3 .s { color:var(--muted); font-size:12px; margin-top:3px; }
  .top3 .s b { color:var(--green); }
  details.lowzone { margin-top:16px; }
  details.lowzone summary { color:var(--muted); font-size:13px; cursor:pointer; padding:8px 0; }
  .dist { display:flex; gap:8px; }
  .dist div { flex:1; text-align:center; padding:10px 6px; border-radius:10px; background:#141720; }
  .dist .n { font-size:20px; font-weight:800; }
  .dist .l { font-size:11px; color:var(--muted); }
</style>
</head>
<body>
<header>
  <div>
    <h1>AI 자동화 · Jev 인스타 트렌드</h1>
    <div class="meta" id="meta"></div>
  </div>
  <div style="display:flex; gap:8px;">
    <button id="exportNotes">내 메모 내보내기</button>
    <button id="importNotes">메모 불러오기</button>
    <input type="file" id="importFile" accept="application/json" style="display:none">
  </div>
</header>
<main>
  <div>
    <section class="panel">
      <h2>판정 분포 · 트렌드 키워드</h2>
      <div class="dist" id="dist"></div>
      <div class="chips" id="trendChips" style="margin-top:12px"></div>
    </section>
    <section class="panel">
      <h2>아이디어 피드 · 주제: AI 자동화 / Claude·스킬·MCP / 에이전트 / Jev / AI 주식매매 (댓글/팔로우 없이 직접 구현하는 가이드 포함)</h2>
      <div class="filters">
        <input type="search" id="q" placeholder="검색 (아이디어/캡션/계정/키워드)">
        <select id="fTopic"><option value="">주제 전체</option></select>
        <select id="fSource"><option value="">소스 전체</option><option value="saved">인스타(저장)</option><option value="creator">인스타(크리에이터)</option><option value="discover">인스타(해시태그/검색)</option><option value="github">GitHub</option><option value="youtube">YouTube</option></select>
        <select id="fVerdict"><option value="">판정 전체</option><option>실용</option><option>흥미</option><option>비현실</option></select>
        <select id="fTool"><option value="">툴 전체</option></select>
        <select id="fType"><option value="">유형 전체</option></select>
        <select id="fStatus"><option value="">상태 전체</option><option>보류</option><option>시도중</option><option>적용완료</option></select>
        <select id="fPeriod"><option value="">기간 전체</option><option value="7">최근 7일</option><option value="30">최근 30일</option></select>
        <select id="sort"><option value="apply">실용 점수순</option><option value="score">인기(트렌드)순</option><option value="date">최신순</option></select>
      </div>
      <div class="grid" id="feed"></div>
      <details class="lowzone" id="lowzone"><summary id="lowzoneSummary"></summary><div class="grid" id="feedLow"></div></details>
    </section>
  </div>
  <aside>
    <section class="panel">
      <h2>바로 해볼 것 TOP 3</h2>
      <ul class="top3" id="top3"></ul>
    </section>
    <section class="panel">
      <h2>적용 대기열 (시도중)</h2>
      <ul class="queue" id="queue"></ul>
    </section>
    <section class="panel">
      <h2>툴별 언급량 (최근 30일)</h2>
      <div class="bars" id="toolBars"></div>
    </section>
    <section class="panel">
      <h2>적용 완료</h2>
      <ul class="queue" id="done"></ul>
    </section>
  </aside>
</main>

<style>
  #gate { position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:99; }
  #gate form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; width:320px; display:flex; flex-direction:column; gap:12px; }
  #gate h1 { font-size:16px; margin:0; }
  #gate input { background:#141720; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:10px; font-size:14px; }
  #gate .err { color:var(--red); font-size:12px; min-height:16px; }
</style>
<div id="gate"><form id="gateForm"><h1>대시보드 잠금</h1><input type="password" id="pw" placeholder="비밀번호" autofocus autocomplete="current-password"><label style="font-size:12px;color:var(--muted)"><input type="checkbox" id="remember" checked> 이 기기에서 기억</label><div class="err" id="gateErr"></div><button class="primary" type="submit">열기</button></form></div>
<script>
(async function(){
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  async function decrypt(pw, enc) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(enc.salt), iterations:enc.iter, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(enc.iv) }, key, b64(enc.ct));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  const enc = await (await fetch('data.enc.json?ts=' + Date.now(), { cache:'no-store' })).json();
  const form = document.getElementById('gateForm'), err = document.getElementById('gateErr');
  async function tryUnlock(pw, remember) {
    try {
      window.IG_DATA = await decrypt(pw, enc);
      if (remember) localStorage.setItem('ig-dashboard-pw', pw); else localStorage.removeItem('ig-dashboard-pw');
      document.getElementById('gate').remove();
      window.bootDashboard();
      return true;
    } catch (e) { return false; }
  }
  const saved = localStorage.getItem('ig-dashboard-pw');
  if (saved && await tryUnlock(saved, true)) return;
  form.onsubmit = async ev => { ev.preventDefault(); err.textContent = ''; const ok = await tryUnlock(document.getElementById('pw').value, document.getElementById('remember').checked); if (!ok) err.textContent = '비밀번호가 맞지 않아요'; };
})();
</script>
<script>
window.bootDashboard = function(){
  const DATA = window.IG_DATA || { posts: [] };
  const NOTES_KEY = 'ig-dashboard-notes-v1';
  let notes = {};
  try { notes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); } catch(e) { notes = {}; }
  const saveNotes = () => localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
  const noteOf = id => notes[id] || { status: '보류', memo: '' };

  const posts = (DATA.posts || []).map(p => ({ ...p, _date: p.date ? new Date(p.date) : null, _a: p.analysis || null }));
  const applyScore = p => p._a ? p._a.score : 0;
  const verdict = p => p._a ? p._a.verdict : '미분석';
  const now = new Date();
  const daysAgo = d => d ? (now - d) / 86400000 : Infinity;

  document.getElementById('meta').textContent =
    `인스타 ${posts.filter(p=>!['github','youtube'].includes(p.source)).length}개 · GitHub ${posts.filter(p=>p.source==='github').length}개 · YouTube ${posts.filter(p=>p.source==='youtube').length}개 · 마지막 수집 ${DATA.updatedAt ? new Date(DATA.updatedAt).toLocaleString('ko-KR') : '없음'} · 점수는 Aside가 직접 분석한 실용 점수(10점)`;

  const cnt = v => posts.filter(p => verdict(p) === v).length;
  document.getElementById('dist').innerHTML = [['실용', 'var(--green)'], ['흥미', 'var(--amber)'], ['비현실', 'var(--red)']].map(([v, c]) =>
    `<div><div class="n" style="color:${c}">${cnt(v)}</div><div class="l">${v}</div></div>`).join('');

  const uniq = arr => [...new Set(arr)].filter(Boolean).sort();
  const fTool = document.getElementById('fTool'), fType = document.getElementById('fType'), fTopic = document.getElementById('fTopic');
  uniq(posts.flatMap(p => p.topics || [])).forEach(t => fTopic.add(new Option(`${t} (${posts.filter(p=>(p.topics||[]).includes(t)).length})`, t)));
  uniq(posts.flatMap(p => p.tools || [])).forEach(t => fTool.add(new Option(t, t)));
  uniq(posts.flatMap(p => p.types || [])).forEach(t => fType.add(new Option(t, t)));

  const kwScore = {};
  posts.filter(p => (daysAgo(p._date) <= 7 || !p._date) && verdict(p) !== '비현실').forEach(p => {
    [...(p.keywords || []), ...(p.tools || [])].forEach(k => { kwScore[k] = (kwScore[k] || 0) + 1 + applyScore(p) / 10; });
  });
  const chipsEl = document.getElementById('trendChips');
  const topKw = Object.entries(kwScore).sort((a,b) => b[1]-a[1]).slice(0, 15);
  if (!topKw.length) chipsEl.innerHTML = '<span style="color:var(--muted);font-size:13px">최근 7일 키워드 없음</span>';
  topKw.forEach(([k, v]) => {
    const c = document.createElement('span'); c.className = 'chip';
    c.innerHTML = `${k}<small>${Math.round(v)}</small>`;
    c.onclick = () => { document.getElementById('q').value = k; render(); };
    chipsEl.appendChild(c);
  });

  const toolCount = {};
  posts.filter(p => daysAgo(p._date) <= 30 || !p._date).forEach(p => (p.tools||[]).forEach(t => toolCount[t] = (toolCount[t]||0)+1));
  const tc = Object.entries(toolCount).sort((a,b)=>b[1]-a[1]);
  const maxTc = tc[0]?.[1] || 1;
  document.getElementById('toolBars').innerHTML = tc.length ? tc.map(([t,n]) =>
    `<div class="bar"><span>${esc(t)}</span><div class="track"><div class="fill" style="width:${n/maxTc*100}%"></div></div><span>${n}</span></div>`).join('')
    : '<span style="color:var(--muted);font-size:13px">데이터 없음</span>';

  function renderSide() {
    const top3 = posts.filter(p => p._a && noteOf(p.id).status !== '적용완료').sort((a,b) => applyScore(b)-applyScore(a)).slice(0,3);
    document.getElementById('top3').innerHTML = top3.length ? top3.map(p =>
      `<li><div class="t">${esc(p._a.idea)}</div><div class="s"><b>${p._a.score}</b>/10 · ${p.source==='github' ? esc(p.repo||'') : p.source==='youtube' ? '▶ '+esc(p.account||'') : '@'+esc(p.account||'')} · 첫 단계: ${esc((p._a.guide||[])[0]||'')}</div></li>`).join('')
      : '<li style="color:var(--muted)">분석된 아이디어 없음</li>';
    const q = posts.filter(p => noteOf(p.id).status === '시도중');
    const d = posts.filter(p => noteOf(p.id).status === '적용완료');
    const li = p => `<li><a href="${p.url}" target="_blank">${p.source==='github' ? esc(p.repo||'') : p.source==='youtube' ? '▶ '+esc(p.account||'') : '@'+esc(p.account||'')}</a> · ${esc((p._a?.idea||p.summary||'').slice(0,60))}${noteOf(p.id).memo ? `<div style="color:var(--muted);font-size:12px;margin-top:2px">메모: ${esc(noteOf(p.id).memo)}</div>` : ''}</li>`;
    document.getElementById('queue').innerHTML = q.length ? q.map(li).join('') : '<li style="color:var(--muted)">카드에서 상태를 "시도중"으로 바꾸면 여기 쌓여요</li>';
    document.getElementById('done').innerHTML = d.length ? d.map(li).join('') : '<li style="color:var(--muted)">아직 없음</li>';
  }

  function card(p) {
    const n = noteOf(p.id), a = p._a;
    return `<div class="card ${a && a.verdict === '비현실' ? 'dim' : ''}" data-id="${p.id}">
      <div class="top"><span class="acct">${p.source==='github' ? esc(p.repo||p.account) : p.source==='youtube' ? '▶ '+esc(p.account||'') : '@'+esc(p.account||'?')}</span><span>${p.source==='github' ? `GitHub · ${esc(p.lang||'')} · ${p.created ? p.created.slice(0,7)+' 시작' : ''}` : p.source==='youtube' ? `YouTube · ${p._date ? p._date.toLocaleDateString('ko-KR') : ''} · ${p.ytMinutes||'?'}분` : `${p._date ? p._date.toLocaleDateString('ko-KR') : ''} · 인스타`}</span></div>
      ${p.source==='youtube' ? `<div class="summary" style="color:var(--text)">${esc(p.title||'')}</div>` : ''}
      ${a ? `<div class="scorebox"><span class="bigscore ${a.verdict}">${a.score}</span><span style="color:var(--muted);font-size:12px">/10</span><span class="verdict ${a.verdict}">${a.verdict}</span></div>` : ''}
      <div class="idea">${esc(a ? a.idea : (p.summary || (p.caption||'').slice(0,120)))}</div>
      ${a ? `<div class="summary">${esc(p.summary||'')}</div>` : ''}
      ${a ? `<div class="subscores"><span>실현 <b>${a.feasibility}</b></span><span>효과 <b>${a.impact}</b></span><span>난이도 <b>${a.effort}</b></span><span>과장 <b>${a.hype}</b></span></div>` : ''}
      ${a ? `<div class="why">${esc(a.why)}</div>` : ''}
      ${a && a.gate ? `<div class="gate">✓ ${esc(a.gate)}</div>` : ''}
      ${a && (a.guide||[]).length ? `<details class="guide" ${a.verdict==='실용' ? 'open' : ''}><summary>직접 구현 가이드 (${a.guide.length}단계)</summary><ol>${a.guide.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></details>` : (p.checklist||[]).length ? `<details class="guide"><summary>체크리스트 (${p.checklist.length})</summary><ol>${p.checklist.map(c=>`<li>${esc(c)}</li>`).join('')}</ol></details>` : ''}
      <div class="tags">${(p.topics||[]).map(t=>`<span class="tag topic">${esc(t)}</span>`).join('')}${(p.tools||[]).map(t=>`<span class="tag tool">${esc(t)}</span>`).join('')}${(p.types||[]).map(t=>`<span class="tag type">${esc(t)}</span>`).join('')}${(p.keywords||[]).slice(0,4).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>
      <div class="stats">${p.source==='github' ? `<span>★ ${fmt(p.ghStars)}</span><span style="color:var(--green)">+${fmt(p.ghDelta)} ${p.ghPeriod==='daily'?'오늘':p.ghPeriod==='monthly'?'이달':'이번 주'}</span>${p.license?`<span>${esc(p.license)}</span>`:''}` : p.source==='youtube' ? `<span>▶ ${fmt(p.ytViews)}회</span>` : `<span>♥ ${fmt(p.likes)}</span><span>💬 ${fmt(p.comments)}</span><span>인기 ${fmt(p.score)}</span>`}<a href="${p.url}" target="_blank" style="margin-left:auto;color:var(--accent)">${p.source==='github'?'저장소':p.source==='youtube'?'영상':'원문'}</a></div>
      <div class="caption">${esc(p.caption||'')}</div>
      <div class="actions">
        <span class="status ${n.status}">${n.status}</span>
        <select class="setStatus"><option ${n.status==='보류'?'selected':''}>보류</option><option ${n.status==='시도중'?'selected':''}>시도중</option><option ${n.status==='적용완료'?'selected':''}>적용완료</option></select>
        <button class="toggleCap" style="margin-left:auto">캡션</button>
      </div>
      <textarea class="memo" placeholder="내 워크플로우에 어떻게 적용할까?">${esc(n.memo)}</textarea>
    </div>`;
  }

  function bind(container) {
    container.querySelectorAll('.card').forEach(c => {
      const id = c.dataset.id;
      c.querySelector('.setStatus').onchange = e => { notes[id] = { ...noteOf(id), status: e.target.value }; saveNotes(); render(); renderSide(); };
      c.querySelector('.memo').onblur = e => { notes[id] = { ...noteOf(id), memo: e.target.value }; saveNotes(); renderSide(); };
      c.querySelector('.toggleCap').onclick = () => c.classList.toggle('open');
    });
  }

  function render() {
    const q = document.getElementById('q').value.trim().toLowerCase();
    const fs_ = document.getElementById('fSource').value, ft_ = fTopic.value;
    const fv = document.getElementById('fVerdict').value, tool = fTool.value, type = fType.value, status = document.getElementById('fStatus').value;
    const period = document.getElementById('fPeriod').value, sort = document.getElementById('sort').value;
    let list = posts.filter(p => {
      if (fv && verdict(p) !== fv) return false;
      if (fs_ && (p.source||'') !== fs_) return false;
      if (ft_ && !(p.topics||[]).includes(ft_)) return false;
      if (tool && !(p.tools||[]).includes(tool)) return false;
      if (type && !(p.types||[]).includes(type)) return false;
      if (status && noteOf(p.id).status !== status) return false;
      if (period && daysAgo(p._date) > +period) return false;
      if (q) {
        const hay = [p.caption, p.summary, p.account, p.repo, p.title, ...(p.topics||[]), p._a?.idea, p._a?.why, ...(p.keywords||[]), ...(p.tools||[])].join(' ').toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const cmp = sort === 'date' ? (a,b) => (b._date||0)-(a._date||0) : sort === 'score' ? (a,b) => (b.score||0)-(a.score||0) : (a,b) => applyScore(b)-applyScore(a);
    list.sort(cmp);
    const feed = document.getElementById('feed'), low = document.getElementById('feedLow'), lz = document.getElementById('lowzone');
    if (!posts.length) {
      feed.innerHTML = `<div class="empty" style="grid-column:1/-1">아직 수집된 게시물이 없어요.<br>인스타에서 게시물을 <code>저장</code>하면 매일 09:00 루틴이 가져와 분석합니다.</div>`;
      lz.style.display = 'none'; return;
    }
    const main = fv ? list : list.filter(p => verdict(p) !== '비현실');
    const lowList = fv ? [] : list.filter(p => verdict(p) === '비현실');
    feed.innerHTML = main.length ? main.map(card).join('') : `<div class="empty" style="grid-column:1/-1">필터 조건에 맞는 게시물이 없어요.</div>`;
    bind(feed);
    if (lowList.length) { lz.style.display = ''; document.getElementById('lowzoneSummary').textContent = `비현실 / 참고만 (${lowList.length}) 펼치기`; low.innerHTML = lowList.map(card).join(''); bind(low); }
    else lz.style.display = 'none';
  }
  ['q','fTopic','fSource','fVerdict','fTool','fType','fStatus','fPeriod','sort'].forEach(id => document.getElementById(id).addEventListener('input', render));
  render(); renderSide();

  document.getElementById('exportNotes').onclick = () => {
    const blob = new Blob([JSON.stringify(notes, null, 2)], { type:'application/json' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'ig-dashboard-notes.json'; a.click();
  };
  document.getElementById('importNotes').onclick = () => document.getElementById('importFile').click();
  document.getElementById('importFile').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try { notes = { ...notes, ...JSON.parse(await f.text()) }; saveNotes(); render(); renderSide(); } catch(err) { alert('JSON 파싱 실패'); }
  };

  function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function fmt(n) { if (n == null) return '-'; n = +n; return n >= 10000 ? (n/10000).toFixed(1)+'만' : n >= 1000 ? (n/1000).toFixed(1)+'k' : String(Math.round(n)); }
};
if (window.IG_DATA) window.bootDashboard();
</script>
</body>
</html>
